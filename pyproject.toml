# 项目配置：声明 Python 版本、运行与开发依赖，以及 pytest 设置。 
[project]
name = "projects"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
